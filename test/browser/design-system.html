<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design system update checks</title>
    <link rel="stylesheet" href="/src/theme.css" />
  </head>
  <body>
    <h1>Design system update checks</h1>
    <ol id="results"></ol>
    <script type="module">
      import {
        bundledDesignSystemVersion,
        downloadDesignSystem,
        startDesignSystemUpdates,
      } from "/src/design-system.ts";
      import bundledStyles from "/src/design-system.css?inline";
      import tokens from "/node_modules/@idy/magpie-design-system/css/tokens.css?raw";
      import components from "/node_modules/@idy/magpie-design-system/css/components.css?raw";
      import fonts from "/node_modules/@idy/magpie-design-system/css/fonts.css?raw";

      const cacheKey = "gizmoth.design-system.v2";
      const nextVersion = "0.4.5"; // Synthetic release newer than the bundled fallback.
      const savedCache = localStorage.getItem(cacheKey);
      const originalFetch = window.fetch.bind(window);
      const results = [];
      let stop;
      const assert = (value, message) => {
        if (!value) throw new Error(message);
      };
      const settle = async (expectedVersion) => {
        const deadline = performance.now() + 5000;
        do {
          await new Promise((resolve) => setTimeout(resolve, 30));
          if (!expectedVersion || installedVersion() === expectedVersion) return;
        } while (performance.now() < deadline);
        throw new Error(`Timed out waiting for ${expectedVersion}`);
      };
      const installedVersion = () => document.querySelector("#gizmoth-design-system")?.dataset.version;
      const reset = () => {
        stop?.();
        document.querySelectorAll("#gizmoth-design-system").forEach((style) => style.remove());
        localStorage.removeItem(cacheKey);
      };
      const serve = (version, failedLayer) => async (input, options) => {
        const url = String(input);
        if (url.endsWith("package.json")) return Response.json({ name: "@idy/magpie-design-system", version });
        if (failedLayer && url.endsWith(`${failedLayer}.css`)) return new Response("Unavailable", { status: 503 });
        if (url.endsWith(".woff2")) {
          if (failedLayer === "font") return new Response("Unavailable", { status: 503 });
          const filename = url.split("/").pop();
          return originalFetch(`/node_modules/@idy/magpie-design-system/fonts/${filename}`, options);
        }
        if (url.endsWith("/fonts.css")) return new Response(fonts);
        return new Response(url.endsWith("/tokens.css") ? tokens : components);
      };
      // Build cache fixtures through the real downloader, including the local
      // package's actual WOFF2 bytes rather than synthetic font payloads.
      const cachedBundle = await downloadDesignSystem(serve(nextVersion));
      const release = (version) => JSON.stringify({ ...cachedBundle, version });
      const check = async (name, run) => {
        reset();
        try {
          await run();
          results.push({ name, pass: true });
        } catch (error) {
          results.push({ name, pass: false, error: String(error) });
        }
        const item = document.createElement("li");
        const result = results.at(-1);
        item.textContent = `${result.pass ? "PASS" : "FAIL"}: ${name}${result.error ? ` — ${result.error}` : ""}`;
        document.querySelector("#results").append(item);
      };
      try {
        await check("Startup installs and caches one complete CDN release including font bytes", async () => {
          window.fetch = serve(nextVersion);
          stop = startDesignSystemUpdates(bundledStyles);
          await settle(nextVersion);
          assert(installedVersion() === nextVersion, "CDN release was not installed");
          const cached = JSON.parse(localStorage.getItem(cacheKey));
          assert(cached.version === nextVersion, "Successful release was not cached");
          assert(cached.fonts.includes("data:font/woff2;base64,"), "Font bytes were not cached");
          assert(!cached.fonts.includes("../fonts/"), "Cache still depends on network font URLs");
        });
        await check("Offline startup restores cached styles and decodable font bytes synchronously", async () => {
          localStorage.setItem(cacheKey, release(nextVersion));
          window.fetch = async () => {
            throw new TypeError("Offline fixture");
          };
          stop = startDesignSystemUpdates(bundledStyles);
          assert(installedVersion() === nextVersion, "Cache was not restored before network access");
          const source = cachedBundle.fonts.match(/url\("([^"]+)"\)/)[1];
          const face = await new FontFace("Offline cache fixture", `url("${source}")`, { weight: "300" }).load();
          assert(face.status === "loaded", "Cached WOFF2 bytes cannot render offline");
          await settle();
          assert(installedVersion() === nextVersion, "Offline failure replaced cached styles");
        });
        await check("First launch offline retains the bundled theme", async () => {
          window.fetch = async () => {
            throw new TypeError("Offline fixture");
          };
          stop = startDesignSystemUpdates(bundledStyles);
          await settle();
          assert(
            document.querySelector("#gizmoth-design-system").dataset.source === "bundled",
            "Offline startup replaced the bundled styles",
          );
          assert(
            getComputedStyle(document.documentElement).getPropertyValue("--mds-canvas").trim(),
            "Bundled theme is missing",
          );
        });
        await check("A partial stylesheet download leaves the cached release intact", async () => {
          localStorage.setItem(cacheKey, release(bundledDesignSystemVersion));
          window.fetch = serve(nextVersion, "components");
          stop = startDesignSystemUpdates(bundledStyles);
          await settle();
          assert(installedVersion() === bundledDesignSystemVersion, "Partial download was applied");
          assert(
            JSON.parse(localStorage.getItem(cacheKey)).version === bundledDesignSystemVersion,
            "Partial download poisoned the cache",
          );
        });
        await check("A failed font download leaves the current styles and cached font bytes intact", async () => {
          const cached = release(bundledDesignSystemVersion);
          localStorage.setItem(cacheKey, cached);
          window.fetch = serve(nextVersion, "font");
          stop = startDesignSystemUpdates(bundledStyles);
          await settle();
          assert(installedVersion() === bundledDesignSystemVersion, "Partial font download was applied");
          assert(localStorage.getItem(cacheKey) === cached, "Failed font download poisoned the cache");
        });
        await check("Network recovery retries and atomically upgrades the theme", async () => {
          localStorage.setItem(cacheKey, release(bundledDesignSystemVersion));
          let online = false;
          window.fetch = async (input, options) =>
            online ? serve(nextVersion)(input, options) : Promise.reject(new TypeError("Offline fixture"));
          stop = startDesignSystemUpdates(bundledStyles);
          await settle();
          online = true;
          window.dispatchEvent(new Event("online"));
          await settle(nextVersion);
          assert(installedVersion() === nextVersion, "Online event did not upgrade styles");
          assert(document.querySelectorAll("#gizmoth-design-system").length === 1, "Upgrade added another stylesheet");
        });
        await check("A stale CDN cannot downgrade a newer cached release", async () => {
          localStorage.setItem(cacheKey, release(nextVersion));
          window.fetch = serve(bundledDesignSystemVersion);
          stop = startDesignSystemUpdates(bundledStyles);
          await settle();
          assert(installedVersion() === nextVersion, "Stale CDN downgraded the active styles");
          assert(JSON.parse(localStorage.getItem(cacheKey)).version === nextVersion, "Stale CDN downgraded the cache");
        });
        await check("Removed upstream declarations do not survive an update", async () => {
          const group = document.createElement("div");
          group.innerHTML = '<div>First row</div><div class="mds-row">Second row</div>';
          document.body.append(group);
          const row = group.lastElementChild;
          const nextComponents = components.replace(
            /(\.mds-row\s*\{[^}]*?)border-top:\s*1px solid var\(--mds-line\);/,
            "$1",
          );
          window.fetch = async (input, options) =>
            String(input).endsWith("/components.css")
              ? new Response(nextComponents)
              : serve(nextVersion)(input, options);
          try {
            stop = startDesignSystemUpdates(bundledStyles);
            assert(getComputedStyle(row).borderTopWidth === "1px", "Fallback fixture lacks the old rule");
            await settle(nextVersion);
            assert(getComputedStyle(row).borderTopWidth === "0px", "Deleted upstream declaration survived");
          } finally {
            group.remove();
          }
        });
        await check("Recovery during a pending request queues one retry", async () => {
          let rejectFirst;
          let manifests = 0;
          window.fetch = async (input, options) => {
            if (String(input).endsWith("package.json") && ++manifests === 1)
              return new Promise((_, reject) => {
                rejectFirst = reject;
              });
            return serve(nextVersion)(input, options);
          };
          stop = startDesignSystemUpdates(bundledStyles);
          window.dispatchEvent(new Event("online"));
          rejectFirst(new TypeError("Old connection failed"));
          await settle(nextVersion);
          assert(installedVersion() === nextVersion && manifests === 2, "Recovery retry was lost");
        });
        await check("Stopped requests cannot install styles or replace the cache", async () => {
          let finishManifest;
          window.fetch = async (input, options) =>
            String(input).endsWith("package.json")
              ? new Promise((resolve) => {
                  finishManifest = resolve;
                })
              : serve(nextVersion)(input, options);
          stop = startDesignSystemUpdates(bundledStyles);
          stop();
          finishManifest(Response.json({ name: "@idy/magpie-design-system", version: nextVersion }));
          await settle();
          assert(
            installedVersion() === bundledDesignSystemVersion && !localStorage.getItem(cacheKey),
            "Stopped request installed an update",
          );
        });
      } finally {
        reset();
        window.fetch = originalFetch;
        if (savedCache !== null) localStorage.setItem(cacheKey, savedCache);
        window.designSystemResults = results;
        document.title = `${results.every((result) => result.pass) ? "PASS" : "FAIL"}: design system updates`;
      }
    </script>
  </body>
</html>
