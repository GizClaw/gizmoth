[package]
name = "gizmoth-compile-agent"
version = "0.1.0"
description = "PID 1 agent inside GizMoth's Linux compile VMs"
license = "MIT"
edition = "2021"
publish = false

# Built for aarch64-unknown-linux-musl by scripts/build-compile-agent.mjs and
# bundled as a resource. It is not a member of the Tauri crate's workspace.
[workspace]

# Exercise archive containment/codecs on the host without Linux PID 1 syscalls.
[lib]
name = "gizmoth_compile_archive"
path = "src/archive.rs"
doctest = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"
bzip2 = "0.6.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
