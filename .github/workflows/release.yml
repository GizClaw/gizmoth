name: Release

# Only the final job writes a draft release and latest.json. Publication is manual.
# Required updater secret: TAURI_SIGNING_PRIVATE_KEY. Set
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD for an encrypted key (empty for an unencrypted key).
# macOS releases also require Developer ID signing and notarization:
# APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8.
# Optional Windows Authenticode signing: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag (vX.Y.Z); never a branch name
        required: true
        type: string

permissions:
  contents: read

# Serialize retries and dispatches for the same tag, without cancelling builds.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - name: Require updater and macOS signing credentials before building
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo '::error::Missing mandatory TAURI_SIGNING_PRIVATE_KEY repository secret'
            exit 1
          fi
          for credential in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [[ -z "${!credential}" ]]; then
              echo "::error::Missing mandatory macOS signing secret $credential"
              exit 1
            fi
          done
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::An explicit stable tag vX.Y.Z is required'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify existing tag, versions and fresh release
        id: tag
        shell: bash
        run: |
          tagged_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          test "$tagged_commit" = "$(git rev-parse HEAD)"
          # Existing releases are refused, even drafts, to prevent mixed retry assets.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$TAG" "$RUNNER_TEMP/release-tags"; then
            echo '::error::Release already exists; remove the failed draft explicitly before retrying'
            exit 1
          fi
          node scripts/release.mjs preflight "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$tagged_commit" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      # Step conditions cannot read secrets directly.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci

      - name: Prepare macOS signing inputs
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi
          # Tauri treats a defined but empty APPLE_CERTIFICATE as an import request.
          # Export only configured values to subsequent steps, preserving multiline secrets.
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          for (const name of ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY', 'APPLE_API_ISSUER', 'APPLE_API_KEY']) {
            const value = process.env[name];
            if (!value) continue;
            const delimiter = randomUUID();
            appendFileSync(process.env.GITHUB_ENV, `${name}<<${delimiter}\n${value}\n${delimiter}\n`);
          }
          NODE

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 4
          $path = Join-Path $env:RUNNER_TEMP "tauri.sign.json"
          Set-Content -Path $path -Value $config -Encoding utf8
          "SIGN_CONFIG=--config $path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build signed updater artifacts without release writes
        uses: tauri-apps/tauri-action@v0
        with:
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ env.SIGN_CONFIG }} -- --locked
      - name: Verify macOS signature, notarization and installer contents
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-release.mjs '${{ matrix.target }}'
      - name: Require installers and updater signatures
        shell: bash
        run: node scripts/release.mjs collect "$TAG" '${{ matrix.target }}' staging
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: staging/*
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-aarch64-apple-darwin
          path: incoming/aarch64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: release-x86_64-apple-darwin
          path: incoming/x86_64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: release-x86_64-pc-windows-msvc
          path: incoming/x86_64-pc-windows-msvc
      - name: Validate all three targets and generate the only updater manifest
        run: node scripts/release.mjs aggregate "$TAG" incoming release-assets
      - name: Verify update signatures against the pinned client key
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
          node scripts/verify-updater-signatures.mjs release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: validated-release
          path: release-assets/*
          if-no-files-found: error
      - name: Create draft and upload manifest last
        shell: bash
        run: |
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$TAG" "$RUNNER_TEMP/release-tags"; then
            echo '::error::Release appeared during build; refusing to mix artifacts'
            exit 1
          fi
          # Refuse a tag that was moved while the build matrix was running.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          # Never --clobber or publish. A failed upload leaves a draft for inspection.
          gh release create "$TAG" --verify-tag --draft --title "GizMoth $TAG" --notes "GizMoth $TAG"
          assets=(release-assets/*)
          for asset in "${assets[@]}"; do
            if [[ "$asset" != release-assets/latest.json ]]; then
              gh release upload "$TAG" "$asset"
            fi
          done
          gh release upload "$TAG" release-assets/latest.json
          gh release view "$TAG" --json isDraft,assets > "$RUNNER_TEMP/uploaded-release.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/uploaded-release.json", "utf8"));
            assert.equal(release.isDraft, true, "Release must remain a draft");
            const expected = fs.readdirSync("release-assets").sort();
            assert.deepEqual(release.assets.map(a => a.name).sort(), expected, "Incomplete release upload");
            for (const asset of release.assets) {
              assert.equal(asset.state, "uploaded", "Unfinished upload: " + asset.name);
              assert.equal(asset.size, fs.statSync("release-assets/" + asset.name).size, "Upload size mismatch");
            }
          '
